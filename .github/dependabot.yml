version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      - dependency-name: "FSharp.Core"
      - dependency-name: "FSharp.Compiler.Service"
